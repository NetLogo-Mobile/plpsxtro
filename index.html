<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品列表 · 物实精选评审自动化平台</title>
<meta name="description" content="物实精选评审系统作品列表：正在评审与完结评审的进度、评分与状态。">
<style>
/* ============================================================
   样式与评审系统 assets/style.css 保持一致（此处内联，便于单文件托管）
   ============================================================ */
:root {
  --brand: #3557d6;
  --brand-dark: #2a45ac;
  --brand-soft: #eef2ff;
  --bg: #f5f7fb;
  --card: #ffffff;
  --line: #e4e8f0;
  --line-soft: #eef1f7;
  --text: #1c2430;
  --muted: #6b7280;
  --green: #128a53;
  --green-soft: #e7f6ee;
  --red: #cf3f3f;
  --red-soft: #fdeceb;
  --blue: #2f6fed;
  --blue-soft: #e9f0fe;
  --orange: #a9660a;
  --orange-soft: #fff5e2;
  --purple: #6d3fd4;
  --purple-soft: #f1ebff;
  --gray-soft: #eef1f5;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 1px 3px rgba(20, 30, 50, .04);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
  display: flex; min-height: 100vh; flex-direction: column; -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 18px; width: 100%; }
main.wrap { flex: 1; padding-top: 20px; padding-bottom: 44px; }

/* 标题区 */
h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: .2px; }
h2 { font-size: 16.5px; margin: 24px 0 10px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lead { color: var(--muted); font-size: 13.5px; margin: 0; max-width: 760px; }
.muted { color: var(--muted); }

/* 卡片 / 统计 */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow);
}
.stat b { display: block; font-size: 23px; color: var(--brand); line-height: 1.3; }
.stat span { color: var(--muted); font-size: 12.5px; }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th { background: #f8fafd; color: #5b6678; font-weight: 600; white-space: nowrap; font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f9fbff; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; }
.tbl-wrap table { min-width: 640px; }
td.desc { color: var(--muted); max-width: 300px; }
td.nowrap { white-space: nowrap; }
td.sug { white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 34px 0; }

/* 徽章 */
.badge { display: inline-block; border-radius: 6px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; border: 1px solid transparent; line-height: 1.6; }
.b-green { background: var(--green-soft);  color: var(--green);  border-color: #bfe8d2; }
.b-red   { background: var(--red-soft);    color: var(--red);    border-color: #f3c6c6; }
.b-blue  { background: var(--blue-soft);   color: var(--blue);   border-color: #c6d8fb; }
.b-gray  { background: var(--gray-soft);   color: var(--muted);  border-color: #dde1e8; }
.b-orange{ background: var(--orange-soft); color: var(--orange); border-color: #ffdca8; }
.b-purple{ background: var(--purple-soft); color: var(--purple); border-color: #d9cbff; }

/* 按钮 */
.btn {
  display: inline-block; border: 1px solid transparent; border-radius: 8px;
  padding: 8px 16px; background: var(--brand); color: #fff;
  font-size: 13.5px; cursor: pointer; transition: background .15s, box-shadow .15s;
  text-align: center; white-space: nowrap; font-family: inherit;
}
.btn:hover { background: var(--brand-dark); text-decoration: none; color: #fff; }
.btn-ghost { background: #fff; color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: #f2f5fa; color: var(--text); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
.btn-jump { background: #fff; color: var(--brand); border-color: #c3d2f7; }
.btn-jump:hover { background: var(--brand-soft); color: var(--brand); }

/* 提示条 */
.flash { background: var(--blue-soft); border: 1px solid #c6d8fb; color: #1d4eab; padding: 10px 14px; border-radius: 9px; margin-bottom: 14px; font-size: 13px; }
.flash.err { background: var(--red-soft); border: 1px solid #f3c6c6; color: #a32626; }

/* 表单 */
label { display: block; font-size: 12.5px; color: #55606f; margin: 12px 0 5px; font-weight: 600; }
input[type=text], input[type=search], select {
  width: 100%; max-width: 420px; min-height: 36px; border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: 13.5px; background: #fff; color: var(--text);
  font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(53, 87, 214, .12); }
.form-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form-row { display: flex; gap: 16px; flex-wrap: wrap; }
.form-row > div { flex: 1; min-width: 170px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
.mono { font-family: Consolas, Menlo, monospace; word-break: break-all; font-size: 12.5px; }
code { background: #f1f4f9; border-radius: 5px; padding: 1px 6px; font-family: Consolas, Menlo, monospace; font-size: 12.5px; color: #33415c; }


.spinner {
  display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line);
  border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite;
  vertical-align: -2px; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
  background: #1c2430; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: .18s; z-index: 50;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  th, td { padding: 8px; }
  .card { padding: 14px; }
  .page-head { flex-direction: column; }
}
</style>
</head>
<body>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>作品列表</h1>
    </div>
    <div class="head-actions">
      <a class="btn" id="btn-main" href="#" target="_blank" rel="noopener">进入评审系统 →</a>
    </div>
  </div>

  <div id="flash-area"></div>

  <div class="grid" id="stats">
    <div class="stat"><b id="s-reviewing">—</b><span>正在评审</span></div>
    <div class="stat"><b id="s-closed">—</b><span>已完结</span></div>
    <div class="stat"><b id="s-passed">—</b><span>已通过</span></div>
    <div class="stat"><b id="s-rejected">—</b><span>未通过</span></div>
  </div>
  <p class="hint" id="data-at" style="margin-top:10px"></p>

  <div class="card">
    <div class="form-row">
      <div style="flex:2 1 260px">
        <label for="q">搜索（作品名 / 作者 / 学科，空格分隔多个关键词）</label>
        <input id="q" type="search" placeholder="例如：物理 申精" autocomplete="off">
      </div>
      <div>
        <label for="subject">学科</label>
        <select id="subject"><option value="all">全部学科</option></select>
      </div>
      <div>
        <label for="sort">排序</label>
        <select id="sort">
          <option value="default">默认</option>
          <option value="avg_desc">均分 高 → 低</option>
          <option value="avg_asc">均分 低 → 高</option>
          <option value="reviews_desc">评审人数 多 → 少</option>
          <option value="title">作品名</option>
          <option value="closed_desc">完结时间 新 → 旧</option>
        </select>
      </div>
      <div style="flex:2 1 240px">
        <label for="api">API 地址</label>
        <input id="api" type="text" spellcheck="false" placeholder="https://plpsxt.plightweb.cn">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-refresh" type="button">刷新</button>
      <button class="btn btn-ghost" id="btn-reset" type="button">重置筛选</button>
      <button class="btn btn-ghost" id="btn-csv" type="button">导出 CSV</button>
      <span class="hint" id="match-info"></span>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0" id="h-reviewing">正在评审（0）</h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>作品</th><th>内容预览</th><th>作者</th><th>学科</th>
          <th>评审人数</th><th>当前均分</th><th>当前状态</th><th>建议</th><th>操作</th>
        </tr></thead>
        <tbody id="rows-reviewing"></tbody>
      </table>
    </div>
    <div class="empty" id="state-reviewing" style="display:none"></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0" id="h-closed">完结评审（0）</h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>作品</th><th>内容预览</th><th>作者</th><th>学科</th>
          <th>最终结果</th><th>最终得分</th><th>完结时间</th><th>操作</th>
        </tr></thead>
        <tbody id="rows-closed"></tbody>
      </table>
    </div>
    <div class="empty" id="state-closed" style="display:none"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var DEFAULT_API = 'https://plpsxt.plightweb.cn';
  var LIMIT = 500;
  var LS_API = 'psxt_rank_api';

  var params = new URLSearchParams(location.search);

  var el = {
    q: document.getElementById('q'),
    subject: document.getElementById('subject'),
    sort: document.getElementById('sort'),
    api: document.getElementById('api'),
    refresh: document.getElementById('btn-refresh'),
    reset: document.getElementById('btn-reset'),
    csv: document.getElementById('btn-csv'),
    matchInfo: document.getElementById('match-info'),
    flashArea: document.getElementById('flash-area'),
    rowsReviewing: document.getElementById('rows-reviewing'),
    rowsClosed: document.getElementById('rows-closed'),
    stateReviewing: document.getElementById('state-reviewing'),
    stateClosed: document.getElementById('state-closed'),
    hReviewing: document.getElementById('h-reviewing'),
    hClosed: document.getElementById('h-closed'),
    sReviewing: document.getElementById('s-reviewing'),
    sClosed: document.getElementById('s-closed'),
    sPassed: document.getElementById('s-passed'),
    sRejected: document.getElementById('s-rejected'),
    dataAt: document.getElementById('data-at'),
    btnMain: document.getElementById('btn-main'),
    toast: document.getElementById('toast')
  };

  var state = {
    apiBase: DEFAULT_API,
    items: [],
    q: params.get('q') || '',
    subject: params.get('subject') || 'all',
    sort: params.get('sort') || 'default',
    generatedAt: '',
    dataUpdatedAt: ''
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function trimSlash(u) { return String(u || '').replace(/\/+$/, ''); }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove('on'); }, 1800);
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制链接代码'); },
        function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制链接代码'); }
    catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }

  function fmtTime(s) {
    if (!s) { return '-'; }
    return String(s).replace('T', ' ').slice(0, 16);
  }
  function num(v, d) {
    if (v === null || v === undefined || v === '') { return '-'; }
    var n = Number(v);
    return isFinite(n) ? n.toFixed(d === undefined ? 2 : d) : '-';
  }
  function subjectList(it) {
    var raw = String(it.subjects || '').trim();
    return raw ? raw.split(/[、,，\/]+/).map(function (x) { return x.trim(); }).filter(Boolean) : ['未分配'];
  }
  function statusBadge(it) {
    var cls = it.status === 'passed' ? 'b-green' : (it.status === 'rejected' ? 'b-red' : 'b-blue');
    var html = '<span class="badge ' + cls + '">' + esc(it.status_text || it.status) + '</span>';
    if (it.auto_passed) { html += ' <span class="badge b-gray">自动通过·精选</span>'; }
    return html;
  }
  function opsCell(it) {
    var link = it.platform_url || (state.apiBase + '/work.php?id=' + it.id);
    var code = it.link_code || it.title || '';
    var html = '<a class="btn btn-sm btn-jump" href="' + esc(link) + '" target="_blank" rel="noopener">查看</a>';
    if (it.plweb_url) { html += ' <a class="btn btn-sm btn-ghost" href="' + esc(it.plweb_url) + '" target="_blank" rel="noopener">物实</a>'; }
    html += ' <button class="btn btn-sm btn-ghost" type="button" data-copy="' + esc(code) + '">链接代码</button>';
    return html;
  }

  /* ---------- 读取数据 ---------- */
  function apiUrl() { return state.apiBase + '/api_rank.php?format=json&limit=' + LIMIT; }

  function load() {
    el.flashArea.innerHTML = '<div class="flash"><span class="spinner"></span>正在读取公开数据…</div>';
    el.refresh.disabled = true;

    var url = apiUrl();
    fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (data) {
        if (!data || data.ok !== true || !Array.isArray(data.items)) { throw new Error('返回数据格式不符合预期'); }
        state.items = data.items;
        state.generatedAt = data.generated_at || '';
        state.dataUpdatedAt = data.data_updated_at || '';
        el.flashArea.innerHTML = '';
        el.refresh.disabled = false;
        fillSubjects();
        render();
      })
      .catch(function (err) {
        el.refresh.disabled = false;
        el.flashArea.innerHTML =
          '<div class="flash err"><b>读取失败</b>：' + esc(err.message) + '<br>' +
          '请求地址：<span class="mono">' + esc(url) + '</span><br>' +
          '请确认 API 地址可达，且该站点允许跨域（Access-Control-Allow-Origin）。<br>' +
          '<button class="btn btn-sm" id="retry" type="button" style="margin-top:8px">重试</button></div>';
        var r = document.getElementById('retry');
        if (r) { r.addEventListener('click', load); }
        ['rowsReviewing', 'rowsClosed'].forEach(function (k) { el[k].innerHTML = ''; });
        ['hReviewing', 'hClosed'].forEach(function (k) { el[k].textContent = el[k].textContent.replace(/（.*/, '（0）'); });
        ['sReviewing', 'sClosed', 'sPassed', 'sRejected'].forEach(function (k) { el[k].textContent = '—'; });
      });
  }

  function fillSubjects() {
    var set = {};
    state.items.forEach(function (it) { subjectList(it).forEach(function (s) { set[s] = 1; }); });
    var names = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'zh'); });
    var html = '<option value="all">全部学科</option>';
    names.forEach(function (n) { html += '<option value="' + esc(n) + '">' + esc(n) + '</option>'; });
    el.subject.innerHTML = html;
    if (state.subject !== 'all' && names.indexOf(state.subject) === -1) { state.subject = 'all'; }
    el.subject.value = state.subject;
  }

  /* ---------- 过滤 / 排序 ---------- */
  function matched() {
    var terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var out = state.items.filter(function (it) {
      if (state.subject !== 'all' && subjectList(it).indexOf(state.subject) === -1) { return false; }
      if (!terms.length) { return true; }
      var hay = (String(it.title || '') + ' ' + String(it.author || '') + ' ' + String(it.subjects || '') + ' ' +
                 String(it.suggestion || '') + ' ' + String(it.description || '')).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    });
    var s = state.sort;
    function avg(it) { return it.avg_score === null || it.avg_score === undefined ? -1 : Number(it.avg_score); }
    out.sort(function (a, b) {
      switch (s) {
        case 'avg_desc':     return avg(b) - avg(a);
        case 'avg_asc':      return (avg(a) < 0 ? 1e9 : avg(a)) - (avg(b) < 0 ? 1e9 : avg(b));
        case 'reviews_desc': return (b.reviews || 0) - (a.reviews || 0);
        case 'title':        return String(a.title || '').localeCompare(String(b.title || ''), 'zh');
        case 'closed_desc':  return String(b.closed_at || '').localeCompare(String(a.closed_at || ''));
        default:             return 0;
      }
    });
    return out;
  }

  /* ---------- 渲染 ---------- */
  function emptyRow(cols, text) {
    return '<tr><td colspan="' + cols + '" class="empty">' + text + '</td></tr>';
  }

  function render() {
    var all = state.items;
    var list = matched();
    var reviewing = list.filter(function (it) { return it.status === 'reviewing'; });
    var closed    = list.filter(function (it) { return it.status !== 'reviewing'; });

    var cReviewing = 0, cPassed = 0, cRejected = 0;
    all.forEach(function (it) {
      if (it.status === 'reviewing') { cReviewing++; }
      else if (it.status === 'passed') { cPassed++; }
      else { cRejected++; }
    });
    el.sReviewing.textContent = cReviewing;
    el.sClosed.textContent = cPassed + cRejected;
    el.sPassed.textContent = cPassed;
    el.sRejected.textContent = cRejected;
    el.dataAt.textContent = state.dataUpdatedAt ? ('数据更新时间：' + fmtTime(state.dataUpdatedAt)) : '';
    el.matchInfo.textContent = '当前筛选命中 ' + list.length + ' / ' + all.length + ' 件'
      + '（评审中 ' + reviewing.length + '，已完结 ' + closed.length + '）';

    el.hReviewing.textContent = '正在评审（' + reviewing.length + '）';
    el.hClosed.textContent = '完结评审（' + closed.length + '）';

    /* 正在评审 */
    if (!reviewing.length) {
      el.rowsReviewing.innerHTML = emptyRow(9, all.length ? '没有符合条件的评审中作品' : '暂无评审中的作品');
    } else {
      var h = '';
      reviewing.forEach(function (it) {
        h += '<tr>' +
          '<td><a href="' + esc(it.platform_url || '#') + '" target="_blank" rel="noopener">' + esc(it.title || '(无标题)') + '</a></td>' +
          '<td class="desc">' + esc(it.description || '') + '</td>' +
          '<td>' + esc(it.author || '-') + '</td>' +
          '<td>' + esc(it.subjects || '未分配') + '</td>' +
          '<td>' + (it.reviews || 0) + '</td>' +
          '<td>' + num(it.avg_score) + '</td>' +
          '<td>' + esc(it.progress || '') + (it.veto ? ' <span class="badge b-red">否决</span>' : '') + '</td>' +
          '<td class="sug">' + esc(it.suggestion || '-') + '</td>' +
          '<td class="nowrap">' + opsCell(it) + '</td>' +
        '</tr>';
      });
      el.rowsReviewing.innerHTML = h;
    }

    /* 完结 */
    if (!closed.length) {
      el.rowsClosed.innerHTML = emptyRow(8, all.length ? '没有符合条件的已完结作品' : '暂无已完结的评审');
    } else {
      var h2 = '';
      closed.forEach(function (it) {
        h2 += '<tr>' +
          '<td><a href="' + esc(it.platform_url || '#') + '" target="_blank" rel="noopener">' + esc(it.title || '(无标题)') + '</a></td>' +
          '<td class="desc">' + esc(it.description || '') + '</td>' +
          '<td>' + esc(it.author || '-') + '</td>' +
          '<td>' + esc(it.subjects || '未分配') + '</td>' +
          '<td>' + statusBadge(it) + '</td>' +
          '<td>' + (it.final_score !== null && it.final_score !== undefined ? num(it.final_score) : '-') + '</td>' +
          '<td class="nowrap">' + esc(fmtTime(it.closed_at)) + '</td>' +
          '<td class="nowrap">' + opsCell(it) + '</td>' +
        '</tr>';
      });
      el.rowsClosed.innerHTML = h2;
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
      b.addEventListener('click', function () { copy(b.getAttribute('data-copy')); });
    });
  }

  /* ---------- CSV ---------- */
  function exportCsv() {
    var list = matched();
    if (!list.length) { toast('没有可导出的数据'); return; }
    var head = ['分组', '作品名', '作者', '学科', '评审人数', '均分', '状态', '建议', '最终得分', '完结时间', '系统链接'];
    var lines = [head.join(',')];
    list.forEach(function (it) {
      var row = [
        it.status === 'reviewing' ? '正在评审' : '完结评审',
        it.title || '', it.author || '', it.subjects || '', (it.reviews || 0),
        (it.avg_score === null || it.avg_score === undefined) ? '' : Number(it.avg_score).toFixed(2),
        it.status_text || it.status || '', it.suggestion || '',
        (it.final_score === null || it.final_score === undefined) ? '' : Number(it.final_score).toFixed(2),
        it.closed_at || '', it.platform_url || ''
      ].map(function (v) {
        v = String(v == null ? '' : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      });
      lines.push(row.join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '公开评审数据_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('已导出 ' + list.length + ' 条');
  }

  function syncLinks() {
    var b = state.apiBase || DEFAULT_API;
    el.btnMain.href = b + '/';
  }

  function bind() {
    el.q.addEventListener('input', function () { state.q = el.q.value; render(); });
    el.subject.addEventListener('change', function () { state.subject = el.subject.value; render(); });
    el.sort.addEventListener('change', function () { state.sort = el.sort.value; render(); });
    el.refresh.addEventListener('click', load);
    el.csv.addEventListener('click', exportCsv);
    el.reset.addEventListener('click', function () {
      state.q = ''; state.subject = 'all'; state.sort = 'default';
      el.q.value = ''; el.subject.value = 'all'; el.sort.value = 'default';
      render();
    });
    el.api.addEventListener('change', function () {
      var v = trimSlash(el.api.value.trim()) || DEFAULT_API;
      state.apiBase = v; el.api.value = v;
      try { localStorage.setItem(LS_API, v); } catch (e) {}
      syncLinks(); load();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(document.activeElement.tagName) === -1) {
        e.preventDefault(); el.q.focus();
      }
      if (e.key === 'Escape' && document.activeElement === el.q) {
        el.q.value = ''; state.q = ''; render(); el.q.blur();
      }
    });
  }

  function init() {
    var saved = '';
    try { saved = localStorage.getItem(LS_API) || ''; } catch (e) {}
    state.apiBase = trimSlash(params.get('api') || saved || DEFAULT_API) || DEFAULT_API;
    if (params.get('api')) { try { localStorage.setItem(LS_API, state.apiBase); } catch (e) {} }

    el.api.value = state.apiBase;
    el.q.value = state.q;
    el.subject.value = 'all';
    el.sort.value = state.sort;

    syncLinks();
    bind();
    load();
  }

  init();
})();
</script>
</body>
</html>
